[project]
name = "risk-monitor"
version = "0.1.0"
description = "Risk Monitor: a Strands agent on Bedrock that flags anomalous transactions and alerts the risk team"
authors = [
    { email = "shashanka141@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.26.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "strands-agents>=1.65.0",
]

[project.scripts]
risk-monitor = "risk_monitor:main"

[project.optional-dependencies]
groq = [
    "openai>=3.51.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bedrock-agentcore-starter-toolkit>=0.3.14",
    "pytest>=9.2.0",
]
